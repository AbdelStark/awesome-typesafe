<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0b111a">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Awesome Jev">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.social_image | default: '/assets/jev-social.png' | absolute_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ page.resource_name | default: 'A visual map of Jev typed decisions' | escape }} | Awesome Jev">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
    <meta name="twitter:image" content="{{ page.social_image | default: '/assets/jev-social.png' | absolute_url }}">
    <meta name="twitter:image:alt" content="{{ page.resource_name | default: 'A visual map of Jev typed decisions' | escape }} | Awesome Jev">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="text/markdown" href="{{ '/README.md' | relative_url }}">
    <link rel="describedby" href="{{ '/llms.txt' | relative_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <script src="{{ '/assets/directory.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/policy.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/designer.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/resource.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to the list</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Awesome Jev home">
          <span class="wordmark__mark" aria-hidden="true">∵</span>
          <span>awesome<span class="wordmark__accent">jev</span></span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="https://docs.typesafe.ai/">Docs</a>
          <a href="https://discord.gg/typesafe">Discord</a>
          <a class="site-nav__primary" href="https://github.com/AbdelStark/awesome-typesafe-jev">View on GitHub ↗</a>
        </nav>
      </div>
    </header>

    <main id="content" class="page-shell">
      <article class="markdown-body">
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>Independent community project. Not affiliated with or endorsed by TypeSafe AI.</p>
        <p><a href="https://github.com/AbdelStark/awesome-typesafe-jev">Source</a> · <a href="https://github.com/AbdelStark/awesome-typesafe-jev/issues">Suggest a resource</a></p>
      </div>
    </footer>
  </body>
</html>
