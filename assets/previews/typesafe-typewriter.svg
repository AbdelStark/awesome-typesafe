<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TypeSafe Typewriter illustrated preview</title>
  <desc id="desc">Editable text beside sixteen abstract judgment signals. The image illustrates the live demo; the signals are not recorded model results.</desc>
  <defs>
    <linearGradient id="back" x2="1" y2="1"><stop stop-color="#111a29"/><stop offset="1" stop-color="#243342"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8de8ee" stroke-opacity=".06"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020910" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#back)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M0 1H1200M0 629H1200" stroke="#83bba9" stroke-opacity=".38"/>
  <circle cx="69" cy="57" r="8" fill="#8de8ee"/>
  <text x="91" y="65" fill="#d7e9e9" font-family="ui-monospace,monospace" font-size="20" letter-spacing="3">LIVE BUILD / 02</text>
  <text x="1120" y="65" fill="#9fc8c7" font-family="ui-monospace,monospace" font-size="18" text-anchor="end">ILLUSTRATION</text>
