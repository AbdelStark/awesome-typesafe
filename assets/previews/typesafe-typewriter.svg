    <text x="85" y="306" fill="#f1f8f6" font-family="Inter,system-ui,sans-serif" font-size="35" font-weight="700">What happens if I</text>
    <text x="85" y="355" fill="#f1f8f6" font-family="Inter,system-ui,sans-serif" font-size="35" font-weight="700">change this sentence?</text>
    <rect x="85" y="390" width="7" height="45" fill="#b9f6d6"/>
