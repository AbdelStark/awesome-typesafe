    <rect x="624" y="129" width="513" height="390" rx="14" fill="#15232f" stroke="#84a7a8" stroke-width="2"/>
    <text x="652" y="174" fill="#8de8ee" font-family="ui-monospace,monospace" font-size="19" letter-spacing="2">16 TYPED JUDGMENTS</text>
